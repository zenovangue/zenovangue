<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="76" viewBox="0 0 1200 76" role="img" aria-label="Github Stats" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <style>
      .n{font-family:"SFMono-Regular",Consolas,"Liberation Mono",Menlo,monospace;font-size:13px;letter-spacing:2px}
      .h{font-family:Didot,"Bodoni MT","Playfair Display",Georgia,"Times New Roman",serif;font-size:27px;letter-spacing:8px;fill:#fafafa}
      @media (prefers-reduced-motion:reduce){*{animation:none!important}}
    </style>
    <linearGradient id="rgb" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="600" y2="0" spreadMethod="repeat">
      <stop offset="0" stop-color="#ff2d55"/><stop offset=".17" stop-color="#ffb300"/><stop offset=".34" stop-color="#35ff7a"/><stop offset=".5" stop-color="#00e5ff"/><stop offset=".67" stop-color="#3d6bff"/><stop offset=".84" stop-color="#b44dff"/><stop offset="1" stop-color="#ff2d55"/>
      <animateTransform attributeName="gradientTransform" type="translate" from="0 0" to="600 0" dur="7s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="fd" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity=".4"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
  </defs>
  <rect width="1200" height="76" fill="#000"/>
  <text class="n" x="2" y="48" fill="url(#rgb)">07</text>
  <text class="h" x="50" y="52">GITHUB STATS</text>
  <rect x="0" y="66" width="130" height="2" fill="url(#rgb)"/>
  <rect x="130" y="66.5" width="1070" height="1" fill="url(#fd)"/>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
